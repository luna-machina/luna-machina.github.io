<!doctypehtml>
  <html lang=en>
    <meta charset=UTF-8>
    <meta content="width=device-width,initial-scale=1" name=viewport>
    <title>Antikythera Mechanism Simulator</title>
    <style>
      :root {
        --bg-color: #121214;
        --panel-bg: #1e1e24;
        --text-color: #e2e8f0;
        --accent-gold: #d4af37;
        --accent-bronze: #cd7f32;
        --bulb-red: #ef4444;
        --bulb-glow: rgba(239, 68, 68, 0.4)
      }

      body {
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        overflow-x: auto
      }

      header {
        margin-top: 20px;
        text-align: center
      }

      h1 {
        margin: 0;
        font-size: 2rem;
        color: var(--accent-gold);
        text-shadow: 0 2px 4px rgba(0, 0, 0, .5);
        letter-spacing: 1px
      }

      .subtitle {
        margin: 5px 0 20px 0;
        font-size: .9rem;
        color: #a0aec0
      }

      .container {
        display: flex;
        flex-wrap: nowrap;
        gap: 30px;
        width: max-content;
        max-width: none;
        justify-content: center;
        align-items: flex-start;
        margin-bottom: 30px
      }

      .simulator-box {
        position: relative;
        background: radial-gradient(circle, #2a2a35 0, #1a1a22 100%);
        border: 3px solid var(--accent-bronze);
        border-radius: 12px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, .7);
        padding: 10px;
        display: flex;
        flex-direction: column;
        align-items: center
      }

      canvas {
        background-color: transparent;
        border-radius: 8px
      }

      .control-panel {
        position: absolute;
        bottom: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        z-index: 10
      }

      .crank-bulb {
        width: 44px;
        height: 44px;
        background: radial-gradient(circle at 30% 30%, #ff6b6b, #b91c1c);
        border: 2px solid #7f1d1d;
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0, 0, 0, .5), 0 0 0 var(--bulb-glow);
        transition: transform .1s, box-shadow .3s
      }

      .crank-bulb:hover {
        box-shadow: 0 6px 15px rgba(0, 0, 0, .6), 0 0 20px var(--bulb-red);
        background: radial-gradient(circle at 30% 30%, #ff8787, #dc2626);
        transform: scale(1.05)
      }

      .crank-label {
        font-size: .75rem;
        font-weight: 700;
        color: #fff;
        background-color: rgba(0, 0, 0, .7);
        padding: 2px 8px;
        border-radius: 10px;
        pointer-events: none;
        text-transform: uppercase;
        letter-spacing: .5px;
        border: 1px solid rgba(255, 255, 255, .1)
      }

      .outputs-panel {
        background-color: var(--panel-bg);
        border-radius: 12px;
        padding: 25px;
        min-width: 280px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, .5);
        border: 1px solid #2d2d38
      }

      .outputs-panel h2 {
        margin-top: 0;
        margin-bottom: 20px;
        font-size: 1.4rem;
        border-bottom: 2px solid var(--accent-gold);
        padding-bottom: 8px;
        color: var(--accent-gold)
      }

      .output-row {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid #2d2d38;
        font-size: .95rem
      }

      .output-row:last-child {
        border-bottom: none
      }

      .history-panel {
        background-color: var(--panel-bg);
        border-radius: 12px;
        padding: 25px;
        width: 320px;
        min-width: 320px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, .5);
        border: 1px solid #2d2d38;
        display: flex;
        flex-direction: column;
        gap: 10px
      }

      .history-panel h2 {
        margin-top: 0;
        margin-bottom: 15px;
        color: var(--accent-gold);
        border-bottom: 2px solid var(--accent-gold);
        padding-bottom: 8px
      }

      .roman-date {
        background: #252530;
        color: #fff;
        border: 1px solid #444;
        padding: 12px;
        border-radius: 8px;
        cursor: pointer;
        text-align: left;
        transition: all .25s ease
      }

      .roman-date:hover {
        background: #353545;
        border-color: var(--accent-gold);
        transform: translateX(4px)
      }

      .label {
        color: #a0aec0;
        font-weight: 500
      }

      .value {
        color: #fff;
        font-family: 'Courier New', Courier, monospace;
        font-weight: 700
      }
    </style>
    <header>
      <h1>Antikythera Mechanism Simulator</h1>
      <p class=subtitle>Click to crank and see the moon phase!
    </header>
    <div class=container>
      <div class=history-panel>
        <h2>Roman Dates</h2><button class=roman-date data-year=-753>753 BC • Founding of Rome</button><button class=roman-date data-year=-509>509 BC • Republic Founded</button><button class=roman-date data-year=-264>264 BC • First Punic War</button><button class=roman-date data-year=-44>44 BC • Ides of March</button><button class=roman-date data-year=-27>27 BC • Augustus Becomes Emperor</button><button class=roman-date data-year=117>AD 117 • Greatest Extent</button><button class=roman-date data-year=476>AD 476 • Fall of Western Empire</button>
      </div>
      <div class=simulator-box><canvas height=550 id=mechanismCanvas width=550></canvas>
        <div class=control-panel>
          <div class=crank-bulb id=crankBulb></div>
          <div class=crank-label>Crank Input</div>
        </div>
      </div>
      <div class=outputs-panel>
        <h2>Output:</h2>
        <div class=output-row><span class=label>Date:</span><span class=value id=outDate>Year 1, Day 1</span></div>
        <div class=output-row><span class=label>Day of Year:</span><span class=value id=outDay>1</span></div>
        <div class=output-row><span class=label>Sun Angle:</span><span class=value id=outSun>0.0°</span></div>
        <div class=output-row><span class=label>Moon Angle:</span><span class=value id=outMoon>0.0°</span></div>
        <div class=output-row><span class=label>Moon Phase Angle:</span><span class=value id=outMoonPhase>0.0°</span></div>
        <div class=output-row><span class=label>Phase:</span><span class=value id=outPhase>New Moon</span></div>
      </div>
    </div>
    <script>
      const canvas = document.getElementById("mechanismCanvas"),
        ctx = canvas.getContext("2d"),
        crankBulb = document.getElementById("crankBulb"),
        outDate = document.getElementById("outDate"),

      let isCranking = !1,
        baseAngle = 0,

        isAutoSpinning = !1,
        spinSpeed = 0,

      const maxSpeed = .08,
        acceleration = 1e-4,

      crankBulb.addEventListener("mousedown", () => {
        isCranking = !0

        isCranking = !1
      }), crankBulb.addEventListener("touchstart", () => {
        isCranking = !0
      }), window.addEventListener("touchend", () => {
        isCranking = !1
      });
      const gears = [{
        id: "main_sun",
        x: 275,
        y: 275,
        radius: 100,
        teeth: 64,
        color: "#d4af37",
        speedMult: 1,
        direction: 1
      }, {
        id: "inter_1",
        x: 275,
        y: 145,
        radius: 28,
        teeth: 18,
        color: "#cd7f32",
        speedMult: -64 / 18,
        direction: -1
      }, {
        id: "inter_2",
        x: 218,
        y: 122,
        radius: 38,

        color: "#b87333",
        speedMult: -64 / 18 * -.75,
        direction: 1
      }, {
        id: "moon_driver",
        x: 218,
        y: 122,

        teeth: 12,
        color: "#8a9a86",
        speedMult: -64 / 18 * -.75,
        direction: 1
      }, {
        id: "moon_final",
        x: 275,
        y: 275,
        radius: 76,
        teeth: 48,
        color: "#c0c0c0",
        speedMult: -64 / 18 * -.75 * -.25,
        direction: -1
      }];
      gears[1].y = gears[0].y - (gears[0].radius + gears[1].radius);
      const angle1_2 = 160 * Math.PI / 180,
        dist1_2 = gears[1].radius + gears[2].radius;
      gears[2].x = gears[1].x + Math.cos(angle1_2) * dist1_2, gears[2].y = gears[1].y + Math.sin(angle1_2) * dist1_2, gears[3].x = gears[2].x, gears[3].y = gears[2].y;
      const dist3_to_center = Math.hypot(gears[3].x - gears[0].x, gears[3].y - gears[0].y);

      function drawGear(e, t, a) {
        a *= t.speedMult;
        e.save(), e.translate(t.x, t.y), e.rotate(a);

          o = t.radius,

        e.beginPath(), e.arc(0, 0, r, 0, 2 * Math.PI), e.fillStyle = t.color, e.globalAlpha = .15, e.fill(), e.globalAlpha = 1, e.beginPath();

          e.lineTo(Math.cos(i) * r, Math.sin(i) * r), e.lineTo(Math.cos(.02 + i) * s, Math.sin(.02 + i) * s), e.lineTo(Math.cos(c - .02) * o, Math.sin(c - .02) * o), e.lineTo(Math.cos(.02 + c) * o, Math.sin(.02 + c) * o), e.lineTo(Math.cos(l - .02) * s, Math.sin(l - .02) * s), e.lineTo(Math.cos(l) * r, Math.sin(l) * r)
        }
        if (e.closePath(), e.lineWidth = 2, e.strokeStyle = t.color, e.fillStyle = rgbaFromHex(t.color, .25), e.fill(), e.stroke(), e.beginPath(), e.arc(0, 0, .4 * r, 0, 2 * Math.PI), e.strokeStyle = t.color, e.lineWidth = 1.5, e.stroke(), 30 < t.radius) {
          e.strokeStyle = t.color, e.lineWidth = 3;
          for (let t = 0; t < 4; t++) e.beginPath(), e.moveTo(Math.cos(t * Math.PI / 2) * (.4 * r), Math.sin(t * Math.PI / 2) * (.4 * r)), e.lineTo(Math.cos(t * Math.PI / 2) * (.8 * r), Math.sin(t * Math.PI / 2) * (.8 * r)), e.stroke()
        }
        e.beginPath(), e.arc(0, 0, 5, 0, 2 * Math.PI), e.fillStyle = "#fff", e.fill(), e.restore()
      }

      function rgbaFromHex(t, e) {
        return t.startsWith("#") && (t = t.slice(1)), `rgba(${parseInt(t.substring(0,2),16)}, ${parseInt(t.substring(2,4),16)}, ${parseInt(t.substring(4,6),16)}, ${e})`
      }

      function drawOuterRing() {
        ctx.save(), ctx.translate(275, 275), ctx.beginPath(), ctx.arc(0, 0, 240, 0, 2 * Math.PI), ctx.strokeStyle = varColor("--accent-gold"), ctx.lineWidth = 6, ctx.stroke(), ctx.beginPath(), ctx.arc(0, 0, 225, 0, 2 * Math.PI), ctx.strokeStyle = "rgba(212, 175, 55, 0.3)", ctx.lineWidth = 1, ctx.stroke();
        for (let t = 0; t < 360; t += 5) {
          var e = t * Math.PI / 180,
            a = t % 30 == 0 ? 12 : 6;
          ctx.beginPath(), ctx.moveTo(240 * Math.cos(e), 240 * Math.sin(e)), ctx.lineTo(Math.cos(e) * (240 - a), Math.sin(e) * (240 - a)), ctx.strokeStyle = varColor("--accent-gold"), ctx.lineWidth = t % 30 == 0 ? 2 : 1, ctx.stroke()
        }
        ctx.restore()
      }

      function drawHands() {
        var t = baseAngle,
          e = 13.368266 * baseAngle + 6 * Math.sin(13.368266 * baseAngle) * Math.PI / 180;
        ctx.save(), ctx.translate(275, 275), ctx.rotate(t), ctx.beginPath(), ctx.moveTo(0, 0), ctx.lineTo(220, 0), ctx.strokeStyle = varColor("--accent-gold"), ctx.lineWidth = 3, ctx.stroke(), ctx.beginPath(), ctx.arc(200, 0, 7, 0, 2 * Math.PI), ctx.fillStyle = varColor("--accent-gold"), ctx.fill(), ctx.restore(), ctx.save(), ctx.translate(275, 275), ctx.rotate(e), ctx.beginPath(), ctx.moveTo(0, 0), ctx.lineTo(190, 0), ctx.strokeStyle = "#cbd5e1", ctx.lineWidth = 2.5, ctx.stroke(), ctx.beginPath(), ctx.arc(175, 0, 5, 0, 2 * Math.PI), ctx.fillStyle = "#cbd5e1", ctx.fill(), ctx.restore()
      }

      function varColor(t) {
        return getComputedStyle(document.documentElement).getPropertyValue(t).trim()
      }

      function updateStatusMetrics() {
        var t = baseAngle / (2 * Math.PI) * 365.2422,
          e = (Math.floor(t / 365.2422), Math.floor(t % 365.2422) + 1);
        const a = (180 * baseAngle / Math.PI % 360 + 360) % 360;
        let n = (13.368266 * baseAngle * 180 / Math.PI % 360 + 360) % 360;
        n += 6 * Math.sin(13.368266 * baseAngle), n = (n % 360 + 360) % 360;
        const o = (n - a + 360) % 360;
        let s = "New Moon";
        22.5 <= o && o < 67.5 ? s = "Waxing Crescent" : 67.5 <= o && o < 112.5 ? s = "First Quarter" : 112.5 <= o && o < 157.5 ? s = "Waxing Gibbous" : 157.5 <= o && o < 202.5 ? s = "Full Moon" : 202.5 <= o && o < 247.5 ? s = "Waning Gibbous" : 247.5 <= o && o < 292.5 ? s = "Third Quarter" : 292.5 <= o && o < 337.5 && (s = "Waning Crescent");
        t = Math.max(0, Math.min(baseAngle, 12 * Math.PI)), t = Math.round(t / (12 * Math.PI) * 1229 - 753);
        outDate.textContent = t < 0 ? `${Math.abs(t)} BC` : `AD ${t}`, outDay.textContent = e, outSun.textContent = a.toFixed(1) + "°", outMoon.textContent = n.toFixed(1) + "°", outMoonPhase.textContent = o.toFixed(1) + "°", outPhase.textContent = s
      }
      gears[4].radius = dist3_to_center - gears[3].radius, gears[4].teeth = Math.round(gears[3].teeth * (gears[4].radius / gears[3].radius));
      const romanEvents = {
          "-753": "Founding of Rome",
          "-509": "Roman Republic Founded",
          "-264": "First Punic War Begins",
          "-44": "Ides of March - Julius Caesar Assassinated",
          27: "Augustus Becomes First Emperor",
          117: "Roman Empire at Greatest Extent",
          476: "Fall of Western Roman Empire"
        },
        START_YEAR = -753,
        END_YEAR = 476,
        TOTAL_YEARS = END_YEAR - START_YEAR;

      function loop() {
        var t = spinSpeed / maxSpeed;
        crankBulb.style.boxShadow = `0 4px 10px rgba(0,0,0,0.5),
     0 0 ${10+40*t}px rgba(239,68,68,${.3+.7*t})`, crankBulb.style.transform = `scale(${1+.15*t})`, ctx.clearRect(0, 0, canvas.width, canvas.height), isAutoSpinning && null !== targetAngle ? (t = targetAngle - baseAngle, .01 < Math.abs(t) ? (baseAngle += .05 * t, spinSpeed = Math.min(.02 * Math.abs(t), .15)) : (baseAngle = targetAngle, spinSpeed = 0, isAutoSpinning = !1, targetAngle = null, updateStatusMetrics(), -44 === selectedRomanYear && (outPhase.textContent = "Full Moon", outMoonPhase.textContent = "180.0°"), targetAngle = null)) : (isCranking ? (spinSpeed += acceleration, spinSpeed > maxSpeed && (spinSpeed = maxSpeed)) : (spinSpeed *= .85, spinSpeed < 1e-4 && (spinSpeed = 0)), baseAngle += spinSpeed, 0 < spinSpeed && updateStatusMetrics()), drawOuterRing(), gears.forEach(t => drawGear(ctx, t, baseAngle)), drawHands(), requestAnimationFrame(loop)
      }
      document.querySelectorAll(".roman-date").forEach(e => {
        e.addEventListener("click", () => {
          var t = Number(e.dataset.year),
            t = ((selectedRomanYear = t) - START_YEAR) / TOTAL_YEARS;
          targetAngle = t * Math.PI * 12, isAutoSpinning = !0
        })
      }), loop()
    </script>
